const questions=[...originals,...extras];

let state=JSON.parse(localStorage.getItem("cppQuizState")||"{}");
let current=Number(localStorage.getItem("cppQuizCurrent")||0);
function save(){localStorage.setItem("cppQuizState",JSON.stringify(state));localStorage.setItem("cppQuizCurrent",current)}
function render(){
 const q=questions[current], grid=document.getElementById("grid"); grid.innerHTML="";
 questions.forEach((_,i)=>{let b=document.createElement("button");b.className="num"+(i===current?" current":"")+(state[i]?.ok?" ok":state[i]&&state[i].ok===false?" bad":"");b.textContent=i+1;b.onclick=()=>{current=i;save();render()};grid.appendChild(b)});
 const done=Object.keys(state).length, good=Object.values(state).filter(x=>x.ok).length;
 document.getElementById("score").textContent=`${good} / ${done} · ${done?Math.round(good/done*100):0}%`;
 document.getElementById("progress").style.width=(done/questions.length*100)+"%";
 document.getElementById("cat").innerHTML=`${q[0]} · PYTANIE ${current+1} Z ${questions.length}`+(q[0].includes("DODATKOWE")?'<span class="badge">DODATKOWE</span>':q[0].includes("ORYGINAŁ")?'<span class="badge">ORYGINAŁ</span>':'');
 document.getElementById("question").textContent=q[1];
 let box=document.getElementById("options");box.innerHTML="";
 q[2].forEach((o,i)=>{let b=document.createElement("button");b.className="opt";b.innerHTML=`<b>${String.fromCharCode(65+i)}</b> &nbsp; ${escapeHtml(o)}`;if(state[current]){if(i===q[3])b.classList.add("correct");if(i===state[current].pick&&i!==q[3])b.classList.add("wrong");b.disabled=true}else b.onclick=()=>answer(i);box.appendChild(b)});
 document.getElementById("feedback").textContent=state[current]?q[4]:"";
}
function escapeHtml(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function answer(i){let q=questions[current];state[current]={pick:i,ok:i===q[3]};save();render()}
function go(d){current=Math.max(0,Math.min(questions.length-1,current+d));save();render()}
function resetQuiz(){if(confirm("Wyzerować wszystkie odpowiedzi i wynik?")){state={};current=0;localStorage.removeItem("cppQuizState");localStorage.removeItem("cppQuizCurrent");render()}}
render();
</script></body></html>
